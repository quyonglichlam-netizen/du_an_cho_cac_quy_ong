<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10 - Gửi mẹ 🌼</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a0612;--bg2:#3a0d2a;--ink:#ffe9f1;--muted:#f2b6cd;--accent:#ff5c8a;--card:rgba(255,255,255,.08);--line:rgba(255,160,190,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.p{position:absolute;top:-8vh;will-change:transform;animation:fall linear forwards;opacity:.85}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--r))}}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:2;transition:opacity 1.2s ease}
.hidden{opacity:0;pointer-events:none}
.box{width:min(360px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;backdrop-filter:blur(8px)}
.box h1{font-family:"Playfair Display","Times New Roman",serif;font-size:22px;margin:8px 0 6px;font-weight:600}
.box p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.5}
input{font-family:inherit;width:100%;font-size:22px;letter-spacing:.5em;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{font-family:inherit;font-size:16px;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;margin-top:14px;color:#fff;background:linear-gradient(135deg,#ff5c8a,#d4306a);box-shadow:0 6px 20px rgba(255,92,138,.35)}
button:active{transform:scale(.97)}
#lock{overflow-y:auto}#lock .box{margin:auto}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 12px}
.tile{aspect-ratio:1;margin:0;padding:0;font-size:20px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.tile.open{background:rgba(0,0,0,.3);cursor:default}
.tile.hit{background:linear-gradient(135deg,#ff5c8a,#d4306a);font-weight:600;font-size:22px}
.slots{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.slot{width:38px;height:44px;line-height:44px;border-radius:10px;border:1px dashed var(--line);font-size:22px;color:var(--muted)}
.slot.on{border-style:solid;background:rgba(255,92,138,.25);color:var(--ink)}
.err{min-height:20px;margin-top:10px;color:#ff9ab6;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#main{flex-direction:column;gap:4px;overflow-y:auto;justify-content:flex-start;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:16px}
.garden{height:min(19vh,150px);width:auto;max-width:92vw;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.title{font-family:"Playfair Display","Times New Roman",serif;font-size:clamp(20px,5.2vw,28px);margin:4px 0 0;text-align:center;font-weight:600;text-shadow:0 0 18px rgba(255,92,138,.5)}
.sub{color:var(--muted);margin:0 0 6px;font-size:13.5px}
.letter{width:min(460px,100%);margin:4px 0 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px;backdrop-filter:blur(8px);opacity:0;transform:translateY(20px) scale(.96);transition:all 1.2s ease;min-height:0}
.letter.show{opacity:1;transform:none}
.letter p{margin:0 0 8px;line-height:1.55;font-size:clamp(12px,1.95vh,14.5px);min-height:0}
.letter .sig{text-align:right;color:var(--muted);font-style:italic;margin:0}
#music{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;padding:0;margin:0;font-size:20px;background:var(--card);border:1px solid var(--line);box-shadow:none}
.gift{margin-top:8px}
@media (prefers-reduced-motion:reduce){.sw,.p{animation:none}}
</style>
</head>
<body>
<div id="fx"></div>
<button id="music" class="hidden" aria-label="Bật/tắt nhạc">🎵</button>

<section id="lock" class="screen">
  <div class="box" id="lockbox">
    <div style="font-size:42px">🔒🌼</div>
    <h1>Món quà dành cho mẹ</h1>
    <p>Lật các bông hoa để tìm 4 con số ẩn, rồi nhập vào ô bên dưới nhé</p>
    <div class="grid" id="grid"></div>
    <div class="slots" id="slots"></div>
    <input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="go">Mở khóa</button>
  </div>
</section>

<section id="main" class="screen hidden">
  <svg class="garden" viewBox="0 0 260 150" aria-hidden="true"><defs><g id="xc"><g fill="#fff"><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(0)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(45)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(90)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(135)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(180)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(225)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(270)"/><ellipse cx="0" cy="-9" rx="3.6" ry="8" transform="rotate(315)"/></g><circle r="5" fill="#ffc928"/></g></defs><g class="sw" style="animation-delay:-0.0s"><path d="M50 79 C43 109 57 139 50 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="59" cy="117" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 59 117)"/><use href="#xc" transform="translate(50 72) scale(0.9)"/></g><g class="sw" style="animation-delay:-0.7s"><path d="M104 52 C97 82 111 112 104 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="113" cy="90" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 113 90)"/><use href="#xc" transform="translate(104 42) scale(1.2)"/></g><g class="sw" style="animation-delay:-1.4s"><path d="M160 72 C153 102 167 132 160 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="169" cy="110" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 169 110)"/><use href="#xc" transform="translate(160 64) scale(1.0)"/></g><g class="sw" style="animation-delay:-2.1s"><path d="M212 91 C205 121 219 151 212 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="221" cy="129" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 221 129)"/><use href="#xc" transform="translate(212 84) scale(0.85)"/></g><g class="sw" style="animation-delay:-2.8s"><path d="M132 104 C125 134 139 164 132 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="141" cy="142" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 141 142)"/><use href="#xc" transform="translate(132 98) scale(0.7)"/></g><g class="sw" style="animation-delay:-3.5s"><path d="M18 109 C11 139 25 169 18 146" stroke="#3cae6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="27" cy="147" rx="9" ry="3.6" fill="#2f9e5b" transform="rotate(-30 27 147)"/><use href="#xc" transform="translate(18 104) scale(0.6)"/></g><path d="M0 148 Q65 136 130 146 T260 142 V150 H0Z" fill="#1c6b3c"/></svg>
  <h2 class="title">Chúc mừng ngày 20/10 💖</h2>
  <p class="sub">Một vườn xuyến chi gửi tặng mẹ</p>
  <button id="open" class="gift">🎁 Mở quà</button>
  <div class="letter" id="letter">
    <p id="l1"></p><p id="l2"></p><p id="l3"></p><p id="l4"></p>
    <p class="sig" id="l5"></p>
    <div id="ans" style="text-align:center;display:none"><button id="yes">Mẹ cảm ơn con nhé 💖</button></div>
  </div>
</section>

<script>
(function(){
  // ====== Tùy chỉnh tại đây ======
  var PASSWORD="2010";
  var LINES=[
    "Gửi mẹ yêu,",
    "Nhân ngày 20/10, con chúc mẹ luôn tươi vui như những bông xuyến chi ven đường: giản dị, dịu dàng mà vẫn rạng ngời dưới nắng.",
    "Cảm ơn mẹ đã âm thầm che chở, lo cho con từng bữa cơm, từng giấc ngủ suốt những năm qua.",
    "Con chúc mẹ luôn khỏe mạnh, bình an, và mỗi ngày của mẹ đều ngập tràn niềm vui như một vườn hoa nở rộ.",
    "Con yêu mẹ nhiều lắm! 🌼"
  ];
  // ===============================
  var $=function(i){return document.getElementById(i)};
  var fx=$("fx"),timer=null;

  function spawn(){
    var e=document.createElement("div"),r=Math.random();
    e.className="p";
    e.textContent=r<.5?"🌼":r<.8?"🤍":"💗";
    var s=14+Math.random()*20,d=7+Math.random()*7;
    e.style.cssText="left:"+(Math.random()*100)+"vw;font-size:"+s+"px;animation-duration:"+d+"s;--dx:"+((Math.random()-.5)*160)+"px;--r:"+((Math.random()-.5)*540)+"deg";
    fx.appendChild(e);
    setTimeout(function(){e.remove()},d*1000);
  }
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    for(var i=0;i<6;i++)setTimeout(spawn,i*300);
    timer=setInterval(spawn,700);
  }

  // Trò chơi tìm mật khẩu: 4 con số ẩn dưới 12 bông hoa
  (function(){
    var code=PASSWORD.split(""),total=12,found=0,g=$("grid"),sl=$("slots"),pos=[];
    while(pos.length<code.length){var r=Math.floor(Math.random()*total);if(pos.indexOf(r)<0)pos.push(r)}
    code.forEach(function(){var d=document.createElement("div");d.className="slot";d.textContent="?";sl.appendChild(d)});
    for(var i=0;i<total;i++)(function(i){
      var b=document.createElement("button");b.className="tile";b.textContent="🌼";b.setAttribute("aria-label","Bông hoa "+(i+1));
      b.onclick=function(){
        if(b.classList.contains("open"))return;
        b.classList.add("open");
        var k=pos.indexOf(i);
        if(k>=0){
          b.classList.add("hit");b.textContent=code[k];
          var s=sl.children[k];s.textContent=code[k];s.classList.add("on");
          if(++found===code.length)$("err").textContent="Đủ 4 số rồi! Nhập vào ô nhập nhé 🔑";
        }else b.textContent="🍃";
      };
      g.appendChild(b);
    })(i);
  })();

  // Mở khóa
  function unlock(){
    if($("pw").value.trim()===PASSWORD){
      $("lock").classList.add("hidden");
      setTimeout(function(){$("lock").style.display="none"},1200);
      $("main").classList.remove("hidden");
      $("music").classList.remove("hidden");
      play();
    }else{
      $("err").textContent="Chưa đúng rồi, thử lại nhé 💭";
      var b=$("lockbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
      $("pw").value="";
    }
  }
  $("go").onclick=unlock;
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});

  // Nhạc nền: phát từ đầu bài ngay khi mở khóa, lặp lại
  // Dữ liệu nhạc nằm ở cuối file (window.AUDIO_DATA) để phần code ở trên dễ đọc
  var ctx=null,buf=null,src=null,on=false,started=false,decoding=false,fb=null;
  function toBuf(){
    var d=window.AUDIO_DATA.split(",")[1],bin=atob(d),u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return u.buffer;
  }
  function fallback(){ // nếu trình duyệt không giải mã được bằng WebAudio thì dùng thẻ audio thường
    try{fb=fb||new Audio(window.AUDIO_DATA);fb.loop=true;if(on)fb.play()}catch(e){}
  }
  function startSrc(){
    if(src||!buf||!ctx)return;
    src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(ctx.destination);src.start(0);
  }
  function prepare(){
    if(!ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C){fallback();return}ctx=new C()}
    if(buf||decoding)return;
    decoding=true;
    var ok=function(b){buf=b;decoding=false;if(on)startSrc()};
    var bad=function(){decoding=false;fallback()};
    try{var p=ctx.decodeAudioData(toBuf(),ok,bad);if(p&&p.catch)p.catch(bad)}catch(e){bad()}
  }
  function tryPlay(){
    on=true;started=true;
    try{prepare();if(ctx&&ctx.state!=="running")ctx.resume();startSrc();if(fb)fb.play()}catch(e){fallback()}
    $("music").textContent="🎵";
  }
  function stopMusic(){
    on=false;
    try{if(ctx)ctx.suspend();if(fb)fb.pause()}catch(e){}
    $("music").textContent="🔇";
  }
  function play(){if(!on)tryPlay()}
  // Bắt đầu phát ngay từ lần chạm đầu tiên (trình duyệt chỉ cho phát nhạc sau khi người dùng chạm/bấm)
  function firstTouch(e){
    if(started)return;
    if(e.target&&e.target.id==="music")return;
    tryPlay();
  }
  document.addEventListener("pointerdown",firstTouch,true);
  document.addEventListener("keydown",firstTouch,true);
  $("music").onclick=function(){on?stopMusic():tryPlay()};

  // Mở quà: hiện thư, gõ từng dòng
  $("yes").onclick=function(){
    $("yes").textContent="Con yêu mẹ nhiều lắm! 💞";$("yes").disabled=true;
    for(var i=0;i<40;i++)setTimeout(spawn,i*40);
  };
  var opened=false;
  $("open").onclick=function(){
    if(opened)return;opened=true;
    $("open").style.display="none";
    if(!on)tryPlay();
    for(var i=0;i<30;i++)setTimeout(spawn,i*40);
    var L=$("letter");L.classList.add("show");
    var idx=0;
    (function next(){
      if(idx>=LINES.length){$("ans").style.display="block";return;}
      var el=$("l"+(idx+1)),txt=LINES[idx],c=0;
      (function type(){
        el.textContent=txt.slice(0,++c);
        if(c<txt.length)setTimeout(type,28);
        else{idx++;setTimeout(next,350)}
      })();
    })();
  };
})();
</script>
