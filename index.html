<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under The Rain - Tôi & Cô Ấy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #050811 0%, #111827 70%, #1f2937 100%);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Khung thoại */
        .dialogue-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px 25px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2e8f0;
            font-style: italic;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Nút âm thanh */
        .audio-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="rainCanvas"></canvas>

        <button class="audio-btn" id="musicToggle">🎵 Bật nhạc nền</button>

        <div class="dialogue-box">
            <div class="dialogue-text" id="typewriter">
                "Mưa có to thế nào cũng không sao... vì em đã ở đây chờ anh rồi."
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Hạt mưa
        const raindrops = [];
        const numDrops = 150;

        for (let i = 0; i < numDrops; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 10,
                speed: Math.random() * 10 + 10,
                opacity: Math.random() * 0.4 + 0.1
            });
        }

        // Vị trí nhân vật
        let boyX = -50;
        const targetBoyX = canvas.width * 0.42;

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height * 0.75;

            // 1. Đèn đường
            const lightX = canvas.width * 0.65;
            const gradient = ctx.createRadialGradient(lightX, groundY - 200, 10, lightX, groundY - 200, 250);
            gradient.addColorStop(0, 'rgba(253, 224, 71, 0.3)');
            gradient.addColorStop(1, 'rgba(253, 224, 71, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(lightX, groundY - 200, 250, 0, Math.PI * 2);
            ctx.fill();

            // Cột đèn
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(lightX, groundY);
            ctx.lineTo(lightX, groundY - 220);
            ctx.stroke();

            // Bóng đèn
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(lightX, groundY - 220, 10, 0, Math.PI * 2);
            ctx.fill();

            // 2. Mặt đường
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Vệt bóng nước mặt đường
            ctx.fillStyle = 'rgba(253, 224, 71, 0.05)';
            ctx.ellipse(lightX, groundY + 10, 120, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // 3. Nhân vật CÔ ẤY (Cầm ô, đứng bên phải)
            const girlX = canvas.width * 0.58;
            
            // Vẽ Cô ấy
            ctx.fillStyle = '#f472b6'; // Váy hồng
            ctx.beginPath();
            ctx.moveTo(girlX, groundY - 60);
            ctx.lineTo(girlX - 15, groundY - 10);
            ctx.lineTo(girlX + 15, groundY - 10);
            ctx.closePath();
            ctx.fill();

            // Đầu cô ấy
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(girlX, groundY - 70, 10, 0, Math.PI * 2);
            ctx.fill();

            // Chiếc ô
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(girlX, groundY - 90, 45, Math.PI, 0);
            ctx.fill();
            
            // Cán ô
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(girlX, groundY - 90);
            ctx.lineTo(girlX, groundY - 50);
            ctx.stroke();

            // 4. Nhân vật TÔI (Chạy từ trái qua, không ô)
            if (boyX < targetBoyX) {
                boyX += 3;
            }

            // Vẽ Tôi
            ctx.fillStyle = '#1e293b'; // Áo khoác tối màu
            ctx.fillRect(boyX - 8, groundY - 70, 16, 50);

            // Đầu
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(boyX, groundY - 80, 11, 0, Math.PI * 2);
            ctx.fill();

            // Dáng chạy / Chân
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(boyX - 4, groundY - 20);
            ctx.lineTo(boyX - 12, groundY);
            ctx.moveTo(boyX + 4, groundY - 20);
            ctx.lineTo(boyX + 10, groundY);
            ctx.stroke();

            // 5. Hiệu ứng Mưa
            ctx.strokeStyle = 'rgba(191, 219, 254, 0.5)';
            ctx.lineWidth = 1;

            for (let i = 0; i < numDrops; i++) {
                const drop = raindrops[i];
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 2, drop.y + drop.length);
                ctx.stroke();

                drop.y += drop.speed;
                drop.x -= 0.5;

                if (drop.y > canvas.height) {
                    drop.y = -20;
                    drop.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawScene);
        }

        drawScene();

        // Xử lý Âm thanh Synth Lo-fi đơn giản
        let audioCtx = null;
        let isPlaying = false;
        const btn = document.getElementById('musicToggle');

        btn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!isPlaying) {
                audioCtx.resume();
                playLofiMelody();
                btn.innerText = '⏸ Tắt nhạc nền';
                isPlaying = true;
            } else {
                audioCtx.suspend();
                btn.innerText = '🎵 Bật nhạc nền';
                isPlaying = false;
            }
        });

        function playLofiMelody() {
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
            let noteIndex = 0;

            setInterval(() => {
                if (!isPlaying) return;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 2);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 1000);
        }
    </script>
</body>
</html>
